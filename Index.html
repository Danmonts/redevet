<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetConnect - Plataforma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos extra para os cartões de seleção */
    .role-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .role-card.active {
      border-color: #0d9488; /* teal-600 */
      background-color: #f0fdfa; /* teal-50 */
      color: #0f766e; /* teal-700 */
    }
    .role-card.active svg {
      stroke: #0f766e;
    }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Navegação -->
  <nav class="bg-white border-b border-gray-200 p-4 shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 text-teal-700 font-bold text-xl">
        <!-- Ícone do Logo -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
        VetConnect
      </div>
      <div id="nav-user" class="hidden flex items-center gap-4">
        <span id="user-info" class="text-sm font-medium text-gray-600"></span>
        <button id="btn-logout" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-4 py-2 rounded-lg text-sm transition border border-red-200">Sair</button>
      </div>
    </div>
  </nav>

  <!-- Área Principal -->
  <main class="max-w-6xl mx-auto p-6 flex-1 w-full flex flex-col justify-center">
    
    <!-- Secção de Autenticação -->
    <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-[0_2px_20px_rgba(0,0,0,0.04)] border border-gray-100 w-full my-8">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-gray-900">Bem-vindo ao VetConnect</h2>
        <p class="text-gray-500 mt-1">Faça login ou crie seu perfil para continuar</p>
      </div>
      
      <!-- Dados Básicos -->
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email" id="email" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="seu@email.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Palavra-passe</label>
          <input type="password" id="password" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" placeholder="••••••••">
        </div>
      </div>

      <!-- Tipo de Conta (Para Registo) -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Eu sou... (Apenas para criar conta)</label>
        <div class="space-y-3">
          
          <!-- Card Veterinário -->
          <div class="role-card active border border-gray-200 rounded-lg p-3.5 flex items-center gap-3" data-role="veterinario">
            <div class="bg-gray-100 p-2 rounded-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <span class="font-medium text-gray-700">Veterinário(a) Especialista</span>
          </div>

          <!-- Card Clínica -->
          <div class="role-card border border-gray-200 rounded-lg p-3.5 flex items-center gap-3" data-role="clinica">
            <div class="bg-gray-100 p-2 rounded-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
              </svg>
            </div>
            <span class="font-medium text-gray-700">Clínica Veterinária</span>
          </div>

        </div>
      </div>

      <!-- Campos Dinâmicos para Registo -->
      <div id="vet-fields" class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">CRMV</label>
        <input type="text" id="reg-crm" placeholder="Ex: CRMV-SP 12345" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition">
      </div>

      <div id="clinica-fields" class="mb-6 hidden">
        <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ da Clínica</label>
        <input type="text" id="reg-cnpj" placeholder="Ex: 00.000.000/0000-00" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition">
      </div>
      
      <div class="flex flex-col gap-3">
        <button id="btn-login" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-lg transition shadow-sm">Já tenho conta (Entrar)</button>
        <button id="btn-register" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-sm">Criar meu perfil</button>
      </div>
      <p id="auth-error" class="text-red-500 text-sm mt-4 hidden text-center bg-red-50 p-2 rounded-lg"></p>
    </div>

    <!-- Painel do Veterinário -->
    <div id="vet-dashboard" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
        <h3 class="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3">Publicar Disponibilidade</h3>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">CRM</label>
            <input type="text" id="vet-crm-post" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 bg-gray-50" readonly>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Especialidade</label>
            <select id="vet-specialty" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-teal-500 focus:border-teal-500 outline-none">
              <option value="">Selecione a Especialidade</option>
              <option value="Cardiologia">Cardiologia</option>
              <option value="Ortopedia">Ortopedia</option>
              <option value="Oncologia">Oncologia</option>
              <option value="Anestesiologia">Anestesiologia</option>
              <option value="Dermatologia">Dermatologia</option>
              <option value="Neurologia">Neurologia</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Data</label>
            <input type="date" id="vet-date" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-teal-500 focus:border-teal-500 outline-none">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Horário</label>
            <input type="time" id="vet-time" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-teal-500 focus:border-teal-500 outline-none">
          </div>
          
          <button id="btn-add-slot" class="w-full bg-teal-600 text-white font-bold py-3 rounded-lg hover:bg-teal-700 transition mt-2 shadow-sm">Adicionar Horário</button>
        </div>
      </div>
      
      <div class="col-span-1 lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3">Meus Horários Publicados</h3>
        <div id="vet-slots-list" class="space-y-3">
          <!-- Os horários do veterinário aparecerão aqui -->
        </div>
      </div>
    </div>

    <!-- Painel da Clínica -->
    <div id="clinic-dashboard" class="hidden">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
        <h3 class="text-lg font-bold text-gray-900 mb-4">Pesquisar Especialistas Disponíveis</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input type="text" id="search-specialty" placeholder="Filtrar por Especialidade..." class="border border-gray-300 p-2.5 rounded-lg w-full focus:ring-teal-500 focus:border-teal-500 outline-none">
          <input type="date" id="search-date" class="border border-gray-300 p-2.5 rounded-lg w-full focus:ring-teal-500 focus:border-teal-500 outline-none">
          <button id="btn-search" class="bg-slate-800 text-white font-bold py-2.5 rounded-lg hover:bg-slate-900 transition">Filtrar Resultados</button>
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="available-slots-grid">
        <!-- Os cards de horários disponíveis aparecerão aqui -->
      </div>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // As suas chaves do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB3EOqVbLMQ50WBdCepWl2LRDz51y2ypsY",
      authDomain: "rede-vet.firebaseapp.com",
      projectId: "rede-vet",
      storageBucket: "rede-vet.firebasestorage.app",
      messagingSenderId: "402991382814",
      appId: "1:402991382814:web:511a18668f62075ceb890f",
      measurementId: "G-ZCD3ECCJ80"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserRole = null;
    let selectedRegistrationRole = 'veterinario'; // Default

    // Referências DOM
    const ui = {
      authSection: document.getElementById('auth-section'),
      vetDashboard: document.getElementById('vet-dashboard'),
      clinicDashboard: document.getElementById('clinic-dashboard'),
      navUser: document.getElementById('nav-user'),
      userInfo: document.getElementById('user-info'),
      error: document.getElementById('auth-error'),
      clinicaFields: document.getElementById('clinica-fields'),
      vetFields: document.getElementById('vet-fields'),
      roleCards: document.querySelectorAll('.role-card')
    };

    // Lógica visual dos cartões de seleção (Role Cards)
    ui.roleCards.forEach(card => {
      card.addEventListener('click', () => {
        // Remover classe active de todos
        ui.roleCards.forEach(c => c.classList.remove('active'));
        // Adicionar active ao clicado
        card.classList.add('active');
        // Atualizar variável
        selectedRegistrationRole = card.getAttribute('data-role');
        
        // Alternar campos dinâmicos
        if (selectedRegistrationRole === 'clinica') {
          ui.clinicaFields.classList.remove('hidden');
          ui.vetFields.classList.add('hidden');
        } else {
          ui.clinicaFields.classList.add('hidden');
          ui.vetFields.classList.remove('hidden');
        }
      });
    });

    // Função para alterar a interface consoante o utilizador logado
    function updateUI(user, role) {
      ui.error.classList.add('hidden');
      if (user) {
        ui.authSection.classList.add('hidden');
        ui.navUser.classList.remove('hidden');
        
        const roleText = role === 'veterinario' ? 'Veterinário' : 'Clínica';
        ui.userInfo.innerText = `${user.email} (${roleText})`;
        
        if (role === 'veterinario') {
          ui.vetDashboard.classList.remove('hidden');
          ui.clinicDashboard.classList.add('hidden');
          loadVetSlots(user.uid);
        } else {
          ui.clinicDashboard.classList.remove('hidden');
          ui.vetDashboard.classList.add('hidden');
          loadAllAvailableSlots();
        }
      } else {
        ui.authSection.classList.remove('hidden');
        ui.navUser.classList.add('hidden');
        ui.vetDashboard.classList.add('hidden');
        ui.clinicDashboard.classList.add('hidden');
      }
    }

    // Monitorizar o estado da Autenticação
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          currentUserRole = userDoc.data().role;
          updateUI(user, currentUserRole);
          
          // Preencher automaticamente o CRM no painel se for veterinário
          if(currentUserRole === 'veterinario' && userDoc.data().crm) {
            document.getElementById('vet-crm-post').value = userDoc.data().crm;
          }
        }
      } else {
        updateUI(null, null);
      }
    });

    // Registo de novo utilizador
    document.getElementById('btn-register').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = selectedRegistrationRole;
      
      let crm = "";
      let cnpj = "";

      // Validações
      if (!email || !password) {
        ui.error.innerText = "Por favor, preencha o e-mail e a palavra-passe.";
        ui.error.classList.remove('hidden');
        return;
      }

      if (role === 'veterinario') {
        crm = document.getElementById('reg-crm').value;
        if (!crm) {
          ui.error.innerText = "Por favor, preencha o CRM para registar como Médico Veterinário.";
          ui.error.classList.remove('hidden');
          return;
        }
      } else if (role === 'clinica') {
        cnpj = document.getElementById('reg-cnpj').value;
        if (!cnpj) {
          ui.error.innerText = "Por favor, preencha o CNPJ para registar como Clínica Veterinária.";
          ui.error.classList.remove('hidden');
          return;
        }
      }
      
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        const userData = { role: role, email: email };
        if (role === 'veterinario') userData.crm = crm;
        if (role === 'clinica') userData.cnpj = cnpj;

        await setDoc(doc(db, "users", userCredential.user.uid), userData);
      } catch (error) {
        ui.error.innerText = "Erro ao registar: " + error.message;
        ui.error.classList.remove('hidden');
      }
    });

    // Início de sessão (Login)
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        ui.error.innerText = "Por favor, preencha o e-mail e a palavra-passe para entrar.";
        ui.error.classList.remove('hidden');
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        ui.error.innerText = "Erro ao entrar. Verifique o e-mail e palavra-passe.";
        ui.error.classList.remove('hidden');
      }
    });

    // Terminar sessão (Logout)
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      document.getElementById('reg-cnpj').value = '';
      document.getElementById('reg-crm').value = '';
    });

    // Veterinário: Adicionar horário
    document.getElementById('btn-add-slot').addEventListener('click', async () => {
      const crm = document.getElementById('vet-crm-post').value;
      const specialty = document.getElementById('vet-specialty').value;
      const date = document.getElementById('vet-date').value;
      const time = document.getElementById('vet-time').value;

      if(!crm || !specialty || !date || !time) return alert("Preencha todos os campos do horário.");

      await addDoc(collection(db, "slots"), {
        vetId: auth.currentUser.uid,
        vetEmail: auth.currentUser.email,
        crm, specialty, date, time,
        status: "disponivel"
      });
      alert("Horário publicado com sucesso na plataforma!");
      
      document.getElementById('vet-specialty').value = '';
      document.getElementById('vet-date').value = '';
      document.getElementById('vet-time').value = '';
    });

    // Carregar horários do veterinário em tempo real
    function loadVetSlots(vetId) {
      const q = query(collection(db, "slots"), where("vetId", "==", vetId));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('vet-slots-list');
        list.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          list.innerHTML += `
            <div class="border border-gray-100 p-4 rounded-xl bg-gray-50 flex justify-between items-center transition hover:shadow-sm">
              <div>
                <p class="font-bold text-teal-800 text-lg">${data.specialty} <span class="text-sm font-normal text-gray-500">(${data.crm})</span></p>
                <p class="text-gray-700 flex items-center gap-1 mt-1">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  ${data.date} às ${data.time}
                </p>
                <p class="text-xs mt-2 font-bold uppercase tracking-wider ${data.status === 'disponivel' ? 'text-teal-600 bg-teal-50 px-2 py-1 rounded w-fit' : 'text-orange-600 bg-orange-50 px-2 py-1 rounded w-fit'}">
                  ${data.status.replace('_', ' ')}
                </p>
              </div>
            </div>
          `;
        });
      });
    }

    // Carregar todos os horários disponíveis para as clínicas
    function loadAllAvailableSlots() {
      const q = query(collection(db, "slots"), where("status", "==", "disponivel"));
      onSnapshot(q, (snapshot) => {
        const grid = document.getElementById('available-slots-grid');
        grid.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          grid.innerHTML += `
            <div class="border border-gray-100 p-6 rounded-2xl bg-white shadow-sm hover:shadow-md transition">
              <div class="flex items-center gap-3 mb-3">
                <div class="bg-teal-50 p-2 rounded-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                </div>
                <div>
                  <p class="font-bold text-xl text-gray-900">${data.specialty}</p>
                  <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">CRM: ${data.crm}</p>
                </div>
              </div>
              
              <div class="bg-slate-50 border border-slate-100 text-slate-700 p-3 rounded-xl flex items-center justify-center gap-2 font-medium mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                ${data.date} • ${data.time}
              </div>
              <button onclick="requestSlot('${doc.id}')" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl transition shadow-sm">Solicitar Especialista</button>
            </div>
          `;
        });
      });
    }

    // Função global para a clínica solicitar um horário
    window.requestSlot = async (slotId) => {
      if(confirm("Pretende solicitar este profissional? A nossa equipa entrará em contacto para confirmar o agendamento.")) {
        await updateDoc(doc(db, "slots", slotId), {
          status: "pendente_aprovacao",
          requestedBy: auth.currentUser.email
        });
        alert("Solicitação enviada! Aguarde a confirmação da plataforma VetConnect.");
      }
    };
  </script>
</body>
</html>
